services:

  # -- PostgreSQL database ------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"          # expose for local tools (pgAdmin, DBeaver, etc.)
    volumes:
      - clinic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- Jaeger Tracing -----------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # -- Blazor / ASP.NET Core app ------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: >-
        Host=db;Database=clinic_scheduler;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-Admin@1986}
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__Model: "gemini-2.5-flash"
      Agent__Provider: ${AGENT_PROVIDER:-Gemini}
      Agent__Model: ${AGENT_MODEL:-gemini-2.5-flash}
      Agent__Region: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "ClinicScheduler.Web"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=development"
    volumes:
      - clinic_keys_data:/root/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is ready before starting

volumes:
  clinic_db_data:
  clinic_keys_data:
