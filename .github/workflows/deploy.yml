name: Build, Test & Deploy

on:
  push:
    branches: [MVP]

# Least-privilege default; the deploy job opts into id-token for OIDC.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Restore dependencies
        run: |
          dotnet restore ClinicScheduler/ClinicScheduler.Web/ClinicScheduler.Web.csproj
          dotnet restore ClinicScheduler/ClinicScheduler.Core.Tests/ClinicScheduler.Core.Tests.csproj
          dotnet restore ClinicScheduler/ClinicScheduler.Web.Tests/ClinicScheduler.Web.Tests.csproj

      - name: Build
        run: |
          dotnet build ClinicScheduler/ClinicScheduler.Web/ClinicScheduler.Web.csproj -c Release --no-restore
          dotnet build ClinicScheduler/ClinicScheduler.Core.Tests/ClinicScheduler.Core.Tests.csproj -c Release --no-restore
          dotnet build ClinicScheduler/ClinicScheduler.Web.Tests/ClinicScheduler.Web.Tests.csproj -c Release --no-restore

      - name: Run unit tests
        run: dotnet test ClinicScheduler/ClinicScheduler.Core.Tests -c Release --no-build --verbosity normal

      - name: Run integration tests
        run: dotnet test ClinicScheduler/ClinicScheduler.Web.Tests -c Release --no-build --verbosity normal

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only deploy from the real repo's MVP branch.
    if: github.repository == 'Bradly187/clinic-scheduler' && github.ref == 'refs/heads/MVP'
    permissions:
      id-token: write # required for AWS OIDC federation
      contents: read
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: clinic-scheduler-prod
      ECS_CLUSTER: clinic-scheduler-prod-cluster
      ECS_SERVICE: clinic-scheduler-prod-svc
      ECS_TASK_FAMILY: clinic-scheduler-prod
      CONTAINER_NAME: clinic-scheduler-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE_URI"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
          | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          > task-definition.json

      - name: Render new task definition with the pushed image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
